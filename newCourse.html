<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course – Podfessor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="background-color: #202020; color: greenyellow; font-family: 'Courier New', Courier, monospace">
    <nav class="navbar">
        <a href="index.html">Home</a>
        <div id="accountMenu" class="login-menu"></div>
    </nav>

    <div class="section form-page">
        <h1 id="formTitle">Add Course</h1>
        <form id="course-form" class="stacked-form" novalidate hidden>
            <label for="code">Course code</label>
            <input id="code" name="code" type="text" maxlength="20" placeholder="e.g. DBS311" required>

            <label for="name">Course name</label>
            <input id="name" name="name" type="text" maxlength="150" placeholder="e.g. Database Systems" required>

            <label for="semester_id">Semester</label>
            <select id="semester_id" name="semester_id" required>
                <option value="">Choose a semester</option>
            </select>

            <label for="topics">Topics <span class="hint">(separate with commas)</span></label>
            <input id="topics" name="topics" type="text" placeholder="e.g. SQL, Joins, Indexes">

            <label for="image_url">Image link <span class="hint">(optional)</span></label>
            <input id="image_url" name="image_url" type="url" maxlength="500" placeholder="https://...">

            <label for="notes">Your notes <span class="hint">(Podfessor uses these when you ask about this course)</span></label>
            <textarea id="notes" name="notes" rows="6" maxlength="5000"></textarea>

            <p id="formError" class="chat-error" role="alert"></p>
            <div class="form-actions">
                <button type="submit" class="button">Save Course</button>
                <a href="index.html">Cancel</a>
            </div>
        </form>
        <p id="pageMessage"></p>
    </div>

    <script src="javascript/common.js"></script>
    <script src="javascript/courseForm.js"></script>
</body>
</html>
