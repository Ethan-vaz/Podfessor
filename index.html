<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podfessor App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


    <script src="https://kit.fontawesome.com/efeb3f9255.js" crossorigin="anonymous"></script>

</head>

<body style="background-color: #202020; color: greenyellow; font-family: 'Courier New', Courier, monospace">

    <nav class="navbar">
        <!-- FROGGY 1: home button/logo -->
        <a href="/">Home</a> 
        <!-- FROGGY 2: search bar -->
        <form id="search-form" role="search">
            <input id="searchInput" type="search" placeholder="Search courses..." aria-label="Search courses" />
            <button type="submit" class="search-button" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        <!-- FROGGY 3: menu -->
        <div class="login-menu">
            <a href="about.html">About</a>
        </div>
    </nav>
    <h1 style="font-family: Press Start 2P;">PodFessor App</h1>
    <h2>AI-powered Text-to-Speech Course Summaries </h2>
    <main>
    <!-- OPEN AI CHAT SECTION -->
    <div id="chat" class="section" style="width: 20%;">
        <h5>Ask Podfessor</h5>

        <form id="chat-form">
            <input id="chatInput" style="width: 120px;" type="text" name="chatInput" maxlength="500" placeholder="Ask me about your course!" aria-label="Ask a question about your course"/>
            <button type="submit" class="search-button" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
        <div id="chatResponses" aria-live="polite"></div>

    </div>

    <!-- <div class="card">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1IHqQ0mqdfKUDigOF2Xegj?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    </div> -->
    <!-- <button id="generateButton">GENERATE COURSE CARDS <i class="fa-solid fa-book-open"></i></button> -->

    <!-- CARDS SECTION -->
    <div class="section" style="width: 80%;">
    <div id="semesterContainer"></div>
    <div id="cardsContainer"></div>
    </div>

    </main>

</body>

<script src="javascript/courses.js"></script>
<script src="javascript/courseNotes.js"></script>
<script src="javascript/semesters.js"></script>
<script src="javascript/app.js"></script>
<script src="javascript/chat.js"></script>

</html>
