<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – Podfessor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="background-color: #202020; color: greenyellow; font-family: 'Courier New', Courier, monospace">
    <nav class="navbar">
        <a href="index.html">Home</a>
        <div id="accountMenu" class="login-menu"></div>
    </nav>

    <div class="section form-page">
        <h1>Log In</h1>
        <form id="auth-form" class="stacked-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <p id="formError" class="chat-error" role="alert"></p>
            <button type="submit" class="button">Log In</button>
        </form>
        <p>New here? <a href="signup.html">Create an account</a></p>
    </div>
    <script src="javascript/common.js"></script>
    <script src="javascript/auth.js"></script>
</body>
</html>
